[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdebris"
version = "2.0.0"
description = "Marine debris detection on satellite imagery with open-vocabulary and geospatial foundation models"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
authors = [{ name = "danieltyukov" }]
keywords = [
    "marine-debris", "marine-litter", "remote-sensing", "sentinel-2",
    "object-detection", "open-vocabulary", "owlv2", "sam2", "geospatial",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "geopandas>=1.0",
    "mercantile>=1.2",
    "affine>=2.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.0",
    "tqdm>=4.66",
    "requests>=2.31",
]

[project.optional-dependencies]
models = [
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.45",
    "timm>=1.0",
    "accelerate>=0.30",
    "safetensors>=0.4",
]
data = [
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "odc-stac>=0.3",
]
viz = [
    "matplotlib>=3.8",
    "folium>=0.16",
    "contextily>=1.6",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
eval = [
    "scikit-learn>=1.4",
    "torchmetrics>=1.3",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
all = [
    "mdebris[models,data,viz,api,eval]",
]

[project.scripts]
mdebris = "mdebris.cli:app"

[project.urls]
Homepage = "https://github.com/danieltyukov/marine-debris-ml-model"
Repository = "https://github.com/danieltyukov/marine-debris-ml-model"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mdebris = ["py.typed", "data/samples/*.json", "data/samples/*.tif"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: requires internet access",
    "slow: downloads model weights or large data",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]
